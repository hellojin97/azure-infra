name: Terraform Apply
on:
    push:
        branches: [main]
        paths:
            - "terraform/**"
            - ".github/workflows/terraform-apply.yml"
    workflow_dispatch:
permissions:
    id-token: write
    contents: read

concurrency:
    group: terraform-apply
    cancel-in-progress: false

defaults:
    run:
        working-directory: terraform
jobs:
    apply:
        name: terraform apply
        runs-on: ubuntu-latest
        
        env:
            ARM_USE_OIDC:        "true"
            ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
            ARM_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Azure Login (OIDC)
              uses: azure/login@v2
              with:
                client-id:       ${{ vars.AZURE_CLIENT_ID }}
                tenant-id:       ${{ vars.AZURE_TENANT_ID }}
                subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
            
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: "1.10.0"
                terraform_wrapper: false

            - name: Terraform init
              run: |
                  terraform init \
                    -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
                    -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
                    -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
                    -backend-config="key=terraform.tfstate"

            - name: Terraform plan (saved)
              run: terraform plan -no-color -input=false -out=tfplan

            - name: Terraform apply
              run: terraform apply -no-color -input=false tfplan

            - name: Write apply summary
              if: always()
              run: |
                  {
                      echo "## ✅ Terraform Apply"
                      echo ""
                      echo "Commit: \`${{ github.sha }}\`"
                      echo "Triggered by: ${{ github.actor }}"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Notify Discord
              uses: sarisia/actions-status-discord@v1
              if: always()
              with:
                webhook: ${{ secrets.AZURE_INFRA_DISCORD_WEBHOOK_URL }}
                title: Terraform Apply
            